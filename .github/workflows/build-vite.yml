name: Build Vite portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Add profile photo from repository blob
        run: |
          mkdir -p public/images/profile
          curl -fsSL https://api.github.com/repos/Kandy2705/Kandy2705.github.io/git/blobs/18b7defea7275116a120406f95c25aab1b5190c8 \
            | python3 -c "import sys,json,base64; d=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(d['content']))" \
            > public/images/profile/profile.webp

      - run: npm ci
      - run: cp vite-index.html index.html
      - run: npm run build
      - run: rsync -a dist/ ./
      - run: |
          git config user.name pages-builder
          git config user.email pages-builder@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m 'Publish Vite build'
          git push
