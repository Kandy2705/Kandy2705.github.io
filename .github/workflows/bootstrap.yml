name: Bootstrap portfolio source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and restore portfolio source
        shell: bash
        run: |
          set -euo pipefail
          wc -c .bootstrap/part-00 .bootstrap/part-01 .bootstrap/part-02 .bootstrap/part-03 .bootstrap/part-04
          cat .bootstrap/part-00 .bootstrap/part-01 .bootstrap/part-02 .bootstrap/part-03 .bootstrap/part-04 > /tmp/portfolio-source.b64
          test "$(wc -c < /tmp/portfolio-source.b64)" -eq 77628
          base64 --decode /tmp/portfolio-source.b64 > /tmp/portfolio-source.tar.gz
          echo "19e513b887814fefea3f364f2c4d7eb022adddd01ebf09d873a71230830bbbd2  /tmp/portfolio-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/portfolio-source.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete portfolio source"
          git push
